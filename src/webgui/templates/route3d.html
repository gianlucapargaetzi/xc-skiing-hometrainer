<!DOCTYPE html>
<html lang="de" data-xski-stay="1">
<head>
  <meta charset="utf-8" />
  <title>x-ski – Strecke 3D</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <link rel="stylesheet" href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css" />
  <script src="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/socket.io/4.8.0/socket.io.js"></script>
  <style>
    :root { --ink: #12324a; --muted: #5b7690; --accent: #ff7b00; }
    html, body { margin: 0; height: 100%; background: #dfe9f1; overflow: hidden;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; color: var(--ink); }
    #map { position: absolute; inset: 0; }
    .panel { position: absolute; background: rgba(255,255,255,.9); border-radius: 18px; box-shadow: 0 8px 28px rgba(18,50,74,.18);
      backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px); }
    #hud { top: calc(12px + env(safe-area-inset-top)); left: 12px; padding: 12px 18px; display: grid;
      grid-template-columns: repeat(3, auto); gap: 6px 26px; }
    .lbl { font-size: 13px; font-weight: 700; color: var(--muted); letter-spacing: .04em; text-transform: uppercase; }
    .val { font-size: 34px; font-weight: 800; line-height: 1.05; font-variant-numeric: tabular-nums; }
    .val small { font-size: 16px; font-weight: 700; color: var(--muted); margin-left: 3px; }
    #tech { top: calc(12px + env(safe-area-inset-top)); left: 50%; transform: translateX(-50%); padding: 8px 22px;
      font-size: 26px; font-weight: 900; letter-spacing: .04em; color: #fff; background: rgba(29,78,216,.92); }
    #tech.diag { background: rgba(194,65,12,.92); }
    #next { top: calc(12px + env(safe-area-inset-top)); right: 12px; padding: 10px 16px; max-width: 34vw; display: none; }
    #next .name { font-size: 20px; font-weight: 800; }
    #profile { left: 12px; right: 12px; bottom: calc(12px + env(safe-area-inset-bottom)); height: 120px; padding: 6px 8px; }
    #profile canvas { width: 100%; height: 100%; display: block; }
    #view { position: absolute; right: 12px; bottom: calc(146px + env(safe-area-inset-bottom)); font: inherit; font-size: 17px;
      font-weight: 700; padding: 10px 16px; border-radius: 12px; border: none; background: rgba(255,255,255,.92); color: var(--ink);
      box-shadow: 0 6px 20px rgba(18,50,74,.2); cursor: pointer; }
    #back2d { position: absolute; right: 12px; bottom: calc(196px + env(safe-area-inset-bottom)); font-size: 17px;
      font-weight: 700; padding: 10px 16px; border-radius: 12px; background: rgba(255,255,255,.92); color: var(--ink);
      text-decoration: none; box-shadow: 0 6px 20px rgba(18,50,74,.2); }
    #paused { position: absolute; left: 50%; top: 42%; transform: translate(-50%,-50%); padding: 14px 30px; font-size: 40px;
      font-weight: 900; color: #fff; background: rgba(18,50,74,.85); border-radius: 18px; display: none; }
    #wait { position: absolute; inset: 0; display: grid; place-items: center; background: #f4f8fb; text-align: center; z-index: 10; }
    #wait h1 { font-size: 44px; margin: 0 0 10px; }
    #wait p { font-size: 20px; color: var(--muted); margin: 0; }
    @media (max-width: 820px) { .val { font-size: 26px; } #hud { gap: 4px 16px; } #tech { font-size: 20px; } }
  </style>
</head>
<body>
  <div id="map"></div>
  <div id="hud" class="panel">
    <div><div class="lbl">Tempo</div><div class="val" id="v-speed">–</div></div>
    <div><div class="lbl">Steigung</div><div class="val" id="v-slope">–</div></div>
    <div><div class="lbl">Zeit</div><div class="val" id="v-time">–</div></div>
    <div><div class="lbl">Distanz</div><div class="val" id="v-dist">–</div></div>
    <div><div class="lbl">Bis Ziel</div><div class="val" id="v-left">–</div></div>
    <div><div class="lbl">Höhe</div><div class="val" id="v-ele">–</div></div>
  </div>
  <div id="tech" class="panel">DOUBLE POLING</div>
  <div id="next" class="panel"><div class="lbl">Nächster Posten</div><div class="name" id="next-name"></div><div id="next-dist"></div></div>
  <div id="paused">PAUSE</div>
  <button id="view" type="button">Übersicht</button>
  <a id="back2d" href="/strecke" style="display:none">◀ 2D</a>
  <div id="profile" class="panel"><canvas id="prof"></canvas></div>
  <div id="wait"><div><h1>Warten auf Training …</h1><p>Sobald am x-ski eine Streckensimulation läuft, erscheint sie hier in 3D.</p></div></div>

<script>
(() => {
  "use strict";
  // 3D-Ansicht der Streckensimulation (MapLibre mit Geländemodell). Gedacht für ein Tablet im selben Netz:
  // die Grafik rechnet das Tablet, x-ski schickt nur die Position (route_position, 4× pro Sekunde).
  const SWISS = (lon, lat) => lon > 5.9 && lon < 10.6 && lat > 45.8 && lat < 47.9;
  const FOLLOW = { pitch: 62, zoom: 15.2 };
  let map = null, route = null, routeFile = null, follow = true, bearing = null, lastData = 0, lastDriven = 0;

  // ---------------------- Karte ----------------------
  function createMap(center) {
    const swiss = SWISS(center[0], center[1]);
    const tiles = swiss
      ? ["https://wmts.geo.admin.ch/1.0.0/ch.swisstopo.pixelkarte-farbe-winter/default/current/3857/{z}/{x}/{y}.jpeg"]
      : ["https://a.tile.opentopomap.org/{z}/{x}/{y}.png", "https://b.tile.opentopomap.org/{z}/{x}/{y}.png",
         "https://c.tile.opentopomap.org/{z}/{x}/{y}.png"];
    map = new maplibregl.Map({
      container: "map", center, zoom: 13, pitch: FOLLOW.pitch, maxPitch: 80, attributionControl: { compact: true },
      style: {
        version: 8,
        sources: {
          base: { type: "raster", tiles, tileSize: 256, maxzoom: swiss ? 18 : 17,
                  attribution: swiss ? "© swisstopo" : "© OpenTopoMap (CC-BY-SA), © OpenStreetMap" },
          dem: { type: "raster-dem", encoding: "terrarium", tileSize: 256, maxzoom: 15,
                 tiles: ["https://s3.amazonaws.com/elevation-tiles-prod/terrarium/{z}/{x}/{y}.png"],
                 attribution: "Höhen: Mapzen Terrain Tiles" },
        },
        layers: [{ id: "base", type: "raster", source: "base" }],
        terrain: { source: "dem", exaggeration: 1.4 },
      },
    });
    map.on("load", () => {
      map.addSource("route", { type: "geojson", data: line(route.coordinates) });
      map.addSource("driven", { type: "geojson", data: line([]) });
      map.addLayer({ id: "route-casing", type: "line", source: "route", paint: { "line-color": "#fff", "line-width": 9 },
                     layout: { "line-cap": "round", "line-join": "round" } });
      map.addLayer({ id: "route", type: "line", source: "route", paint: { "line-color": "#1d4ed8", "line-width": 5 },
                     layout: { "line-cap": "round", "line-join": "round" } });
      map.addLayer({ id: "driven", type: "line", source: "driven", paint: { "line-color": "#ff7b00", "line-width": 6 },
                     layout: { "line-cap": "round", "line-join": "round" } });
      for (const wp of route.waypoints || []) {
        const el = document.createElement("div");
        el.style.cssText = "background:#b91c1c;color:#fff;font:700 13px sans-serif;padding:3px 7px;border-radius:8px;" +
          "box-shadow:0 2px 6px rgba(0,0,0,.3);white-space:nowrap";
        el.textContent = wp.name;
        new maplibregl.Marker({ element: el, anchor: "bottom" }).setLngLat(pointAt(wp.distance_m)).addTo(map);
      }
    });
    const dot = document.createElement("div");
    dot.style.cssText = "width:22px;height:22px;border-radius:50%;background:#ff7b00;border:4px solid #fff;" +
      "box-shadow:0 0 0 2px #ff7b00,0 4px 12px rgba(0,0,0,.4)";
    map.skier = new maplibregl.Marker({ element: dot }).setLngLat(center).addTo(map);
    map.on("dragstart", () => setFollow(false));
    map.on("error", (e) => {
      const msg = e && e.error ? (e.error.message || String(e.error)) : String(e);
      console.warn("Karte:", msg);
      (window.xskiErrors = window.xskiErrors || []).push(msg);
    });
    window.xskiMap = map;          // zum Nachsehen in der Browser-Konsole
  }

  const line = (coords) => ({ type: "Feature", properties: {}, geometry: { type: "LineString", coordinates: coords } });

  // Punkt auf der Strecke bei einer Distanz (lineare Interpolation zwischen den Stützpunkten)
  function pointAt(d) {
    const ds = route.coordinate_distance_m, cs = route.coordinates;
    if (d <= ds[0]) return cs[0];
    let lo = 0, hi = ds.length - 1;
    if (d >= ds[hi]) return cs[hi];
    while (hi - lo > 1) { const m = (lo + hi) >> 1; if (ds[m] <= d) lo = m; else hi = m; }
    const t = (d - ds[lo]) / Math.max(1e-6, ds[hi] - ds[lo]);
    return [cs[lo][0] + t * (cs[hi][0] - cs[lo][0]), cs[lo][1] + t * (cs[hi][1] - cs[lo][1])];
  }

  function drivenCoords(start, d) {
    const ds = route.coordinate_distance_m, cs = route.coordinates, out = [pointAt(start)];
    for (let i = 0; i < ds.length; i++) if (ds[i] > start && ds[i] < d) out.push(cs[i]);
    out.push(pointAt(d));
    return out;
  }

  function bearingTo(a, b) {
    const r = Math.PI / 180, y = Math.sin((b[0] - a[0]) * r) * Math.cos(b[1] * r);
    const x = Math.cos(a[1] * r) * Math.sin(b[1] * r) - Math.sin(a[1] * r) * Math.cos(b[1] * r) * Math.cos((b[0] - a[0]) * r);
    return (Math.atan2(y, x) / r + 360) % 360;
  }

  function smoothBearing(target) {
    if (bearing === null) return (bearing = target);
    let diff = ((target - bearing + 540) % 360) - 180;
    bearing = (bearing + 0.04 * diff + 360) % 360;       // ruhige Kamera, keine Sprünge in Kurven (pro Bild)
    return bearing;
  }

  let camTarget = null, camPos = null, lastFrame = 0;
  function cameraLoop(t) {
    requestAnimationFrame(cameraLoop);
    if (!follow || !map || !camTarget || t - lastFrame < 33) return;     // ~30 Bilder/s reichen
    lastFrame = t;
    const k = 0.15;                                                     // weich zur gemeldeten Position
    camPos = camPos ? [camPos[0] + k * (camTarget.pos[0] - camPos[0]), camPos[1] + k * (camTarget.pos[1] - camPos[1])]
                    : camTarget.pos.slice();
    const b = smoothBearing(bearingTo(camPos, camTarget.ahead));
    map.jumpTo({ center: camPos, bearing: b, pitch: FOLLOW.pitch, zoom: FOLLOW.zoom });
  }
  requestAnimationFrame(cameraLoop);

  function setFollow(on) {
    follow = on;
    document.getElementById("view").textContent = on ? "Übersicht" : "Folgen";
    if (!on && route) {
      const b = route.bbox;
      map.fitBounds([[b[0], b[1]], [b[2], b[3]]], { padding: 80, pitch: 45, bearing: 0, duration: 1200 });
    }
  }
  document.getElementById("view").addEventListener("click", () => setFollow(!follow));

  // ---------------------- Daten ----------------------
  async function loadRoute() {
    const r = await (await fetch("/api/route", { cache: "no-store" })).json();
    if (!r.active) return false;
    if (routeFile === r.file && map) return true;
    route = r; routeFile = r.file; bearing = null; camPos = null; camTarget = null;
    if (map) { map.remove(); map = null; }
    createMap(r.coordinates[0]);
    return true;
  }

  const fmtTime = (s) => { s = Math.max(0, Math.round(s)); const h = Math.floor(s / 3600), m = Math.floor(s / 60) % 60;
    return h ? `${h}:${String(m).padStart(2, "0")}:${String(s % 60).padStart(2, "0")}` : `${m}:${String(s % 60).padStart(2, "0")}`; };
  const set = (id, v, unit) => { document.getElementById(id).innerHTML = unit ? `${v}<small>${unit}</small>` : v; };

  let loading = false;
  async function onPosition(p) {
    lastData = Date.now();
    if (!route || !map || routeFile === null) {
      if (loading) return;
      loading = true;
      try { await loadRoute(); } catch (e) { /* nächster Versuch */ }
      loading = false;
      if (!route) return;
    }
    document.getElementById("wait").style.display = "none";
    const pos = [p.lon, p.lat];
    map.skier.setLngLat(pos);
    // Kamera: Ziel setzen; nachgeführt wird Bild für Bild mit jumpTo (siehe cameraLoop). easeTo bei jeder
    // Positionsmeldung liess die Karte mit Gelände leer bleiben (Kamera dauernd «in Bewegung»).
    camTarget = { pos, ahead: pointAt(Math.min(p.distance_m + 150, route.length_m)) };
    if (Date.now() - lastDriven > 1000 && map.getSource("driven")) {
      lastDriven = Date.now();
      map.getSource("driven").setData(line(drivenCoords(p.section_start_m || 0, p.distance_m)));
    }
    set("v-speed", p.speed_kmh.toFixed(1), "km/h");
    set("v-slope", `${p.slope_percent > 0 ? "+" : ""}${p.slope_percent.toFixed(1)}`, "%");
    set("v-time", fmtTime(p.elapsed_s || 0));
    set("v-dist", ((p.distance_m - (p.section_start_m || 0)) / 1000).toFixed(2), "km");
    set("v-left", (Math.max(0, (p.section_end_m || p.length_m) - p.distance_m) / 1000).toFixed(2), "km");
    set("v-ele", Math.round(p.elevation_m), "m");
    const tech = document.getElementById("tech"), diag = (p.technique_weight || 0) >= 0.5;
    tech.textContent = diag ? "DIAGONAL" : "DOUBLE POLING"; tech.classList.toggle("diag", diag);
    document.getElementById("paused").style.display = p.paused ? "block" : "none";
    const nw = p.next_waypoint, box = document.getElementById("next");
    if (nw) {
      box.style.display = "block";
      document.getElementById("next-name").textContent = nw.name;
      document.getElementById("next-dist").textContent = nw.ahead_m >= 1000 ? `in ${(nw.ahead_m / 1000).toFixed(1)} km`
        : `in ${Math.round(nw.ahead_m / 10) * 10} m`;
    } else box.style.display = "none";
    drawProfile(p);
  }

  // Nahprofil −500 m … +1000 m wie in der Streckenansicht
  function slopeColor(s) {
    if (s >= 8) return "#dc2626"; if (s >= 5) return "#f97316"; if (s >= 2) return "#facc15";
    if (s <= -5) return "#0284c7"; if (s <= -2) return "#38bdf8"; return "#94b8a0";
  }
  function drawProfile(p) {
    const win = p.window, canvas = document.getElementById("prof");
    if (!win) return;
    const dpr = Math.min(window.devicePixelRatio || 1, 2), w = canvas.clientWidth, h = canvas.clientHeight;
    canvas.width = Math.round(w * dpr); canvas.height = Math.round(h * dpr);
    const ctx = canvas.getContext("2d"); ctx.scale(dpr, dpr);
    const e = win.elevation_m, sl = win.slope_percent, n = e.length, known = e.filter((v) => v !== null);
    if (known.length < 2) return;
    const lo = Math.min(...known), hi = Math.max(...known), span = Math.max(hi - lo, 30), base = (lo + hi) / 2 - span / 2;
    const x = (i) => 6 + i / (n - 1) * (w - 12), y = (v) => h - 20 - (v - base) / span * (h - 34);
    for (let i = 1; i < n; i++) {
      if (e[i] === null || e[i - 1] === null) continue;
      ctx.fillStyle = slopeColor(sl[i]); ctx.beginPath();
      ctx.moveTo(x(i - 1), h - 20); ctx.lineTo(x(i - 1), y(e[i - 1])); ctx.lineTo(x(i), y(e[i])); ctx.lineTo(x(i), h - 20);
      ctx.closePath(); ctx.fill();
    }
    const pi = (win.position_m - win.start_m) / win.step_m, px = x(pi);
    ctx.strokeStyle = "#ff7b00"; ctx.lineWidth = 3; ctx.beginPath(); ctx.moveTo(px, 4); ctx.lineTo(px, h - 20); ctx.stroke();
    ctx.fillStyle = "#5b7690"; ctx.font = "600 13px sans-serif"; ctx.textAlign = "center";
    for (const m of [-500, 0, 500, 1000]) {
      const xi = x(pi + m / win.step_m);
      if (xi > 20 && xi < w - 20) ctx.fillText(m === 0 ? "jetzt" : `${m > 0 ? "+" : "−"}${Math.abs(m) >= 1000 ? "1 km" : Math.abs(m) + " m"}`, xi, h - 4);
    }
  }

  // Ohne Daten (kein Training, x-ski wechselt gerade ins Startmenü) -> «Warten auf Training»
  setInterval(() => {
    if (Date.now() - lastData > 6000) {
      document.getElementById("wait").style.display = "grid";
      routeFile = null;
    }
  }, 2000);

  // Zurück zur 2D-Ansicht: das Steuergerät zu den Bedienelementen (Pause, Stop …)
  // Zuschauer kommen über «/» zurück und folgen dort wieder automatisch der Seite des Steuergeräts
  fetch("/api/role", { cache: "no-store" }).then((r) => r.json()).then((r) => {
    const back = document.getElementById("back2d");
    back.href = r.control ? "/strecke" : "/";
    back.style.display = "block";
  }).catch(() => {});

  // Ohne WebGL keine 3D-Karte: klar sagen statt leer bleiben
  const probe = document.createElement("canvas");
  if (!(probe.getContext("webgl2") || probe.getContext("webgl"))) {
    document.querySelector("#wait h1").textContent = "Keine 3D-Grafik";
    document.querySelector("#wait p").textContent = "Dieser Browser bietet kein WebGL – die 3D-Ansicht braucht ein Gerät mit 3D-Grafik (z. B. ein Tablet).";
    return;
  }

  // socket.io gibt es nur, während ein Training läuft; der Client verbindet sich danach von selbst neu
  const socket = io({ reconnectionDelayMax: 3000 });
  socket.on("route_position", onPosition);
})();
</script>
<script src="/static/js/viewer.js"></script>
</body>
</html>
