<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="utf-8" />
  <title>x-ski – Konfiguration</title>
  <style>
    :root{
      --brand-orange:#ff7b00;
      --bg:#f7f7f7;
      --card:#ffffff;
      --text:#1a1a1a;
      --muted:#6b7280;
      --border:#e5e7eb;
    }
    *{box-sizing:border-box}
    html,body{height:100%}
    body{
      margin:0;
      background:var(--bg);
      color:var(--text);
      font-family:system-ui,-apple-system,Segoe UI,Roboto,Ubuntu,Cantarell,Noto Sans,sans-serif;
      display:flex;flex-direction:column
    }
    .main{display:grid;grid-template-columns:320px 1fr;gap:16px;padding:16px;flex:1;min-height:0}
    .card{background:var(--card);border:1px solid var(--border);border-radius:12px;box-shadow:0 2px 8px rgba(0,0,0,.06);overflow:hidden;display:flex;flex-direction:column}
    .card h3{margin:0;padding:12px 14px;border-bottom:1px solid var(--border);font-size:16px}
    .list{padding:10px;overflow:auto;flex:1}
    .item{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:10px;border-radius:8px;border:1px solid var(--border);margin-bottom:8px}
    .item.active{border-color:var(--brand-orange)}
    .item-name{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
    .item-actions{display:flex;gap:6px}
    button{
      border:1px solid var(--border);background:#fff;border-radius:8px;padding:8px 12px;cursor:pointer
    }
    button.primary{background:var(--brand-orange);color:#fff;border-color:var(--brand-orange)}
    .editor-wrap{display:flex;flex-direction:column;gap:8px;padding:12px;flex:1;min-height:0}
    .row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
    input[type="text"]{padding:8px 10px;border:1px solid var(--border);border-radius:8px;min-width:220px}
    textarea{
      flex:1;min-height:320px;width:100%;resize:vertical;
      font-family:ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,"Liberation Mono","Courier New",monospace;
      font-size:14px;padding:12px;border:1px solid var(--border);border-radius:10px;background:#fafafa
    }
    .muted{color:var(--muted);font-size:12px}
    .footer{padding:10px 16px;text-align:right;border-top:1px solid var(--border)}
  </style>
</head>
<body>
  <!-- Kopfzeile wiederverwenden -->
  {% include 'partials/header.html' %}

  <div class="main">
    <!-- Liste -->
    <div class="card">
      <h3>Dateien</h3>
      <div class="list" id="fileList"></div>
      <div class="footer">
        <div class="muted">Ordner: <code>/configs</code></div>
      </div>
    </div>

    <!-- Editor -->
    <div class="card">
      <h3>Editor</h3>
      <div class="editor-wrap">
        <div class="row">
          <input id="fileName" type="text" placeholder="datei.json" />
          <button id="btnLoad">Laden</button>
          <button id="btnSave">Speichern</button>
          <button id="btnSaveAs">Speichern unter…</button>
          <button id="btnActivate" class="primary">Aktivieren</button>
        </div>
        <textarea id="editor" spellcheck="false" placeholder="{\n  \"user\": { ... }\n}"></textarea>
        <div class="muted" id="status"> </div>
      </div>
    </div>
  </div>

  <script>
    const fileListEl = document.getElementById('fileList');
    const fileNameEl = document.getElementById('fileName');
    const editorEl   = document.getElementById('editor');
    const statusEl   = document.getElementById('status');

    let currentActive = null;

    function setStatus(msg, ok=true){
      statusEl.textContent = msg;
      statusEl.style.color = ok ? "#16a34a" : "#e11d48";
    }

    async function refreshList(){
      fileListEl.innerHTML = "Lade…";
      const res = await fetch('/api/config/list');
      const data = await res.json();
      currentActive = data.active;

      fileListEl.innerHTML = "";
      data.files.forEach(name => {
        const row = document.createElement('div');
        row.className = 'item' + (currentActive && name === currentActive ? ' active' : '');
        const left = document.createElement('div');
        left.className = 'item-name';
        left.textContent = name + (name === currentActive ? '  (aktiv)' : '');
        const actions = document.createElement('div');
        actions.className = 'item-actions';

        const bLoad = document.createElement('button');
        bLoad.textContent = 'Laden';
        bLoad.onclick = () => loadFile(name);

        const bActivate = document.createElement('button');
        bActivate.textContent = 'Aktivieren';
        bActivate.className = 'primary';
        bActivate.onclick = () => activateFile(name);

        actions.appendChild(bLoad);
        actions.appendChild(bActivate);
        row.appendChild(left);
        row.appendChild(actions);
        fileListEl.appendChild(row);
      });
    }

    async function loadFile(name){
      const res = await fetch('/api/config/get?name=' + encodeURIComponent(name));
      if(!res.ok){ setStatus('Fehler beim Laden: ' + res.statusText, false); return; }
      const data = await res.json();
      fileNameEl.value = data.name;
      editorEl.value = data.content;
      setStatus('Geladen: ' + data.name);
    }

    async function saveFile(name){
      try { JSON.parse(editorEl.value); }
      catch(e){ setStatus('JSON-Fehler: ' + e.message, false); return; }

      const res = await fetch('/api/config/save', {
        method:'POST',
        headers:{'Content-Type':'application/json'},
        body: JSON.stringify({name, content: editorEl.value})
      });
      if(!res.ok){ setStatus('Speichern fehlgeschlagen', false); return; }
      const data = await res.json();
      setStatus('Gespeichert: ' + data.saved);
      refreshList();
    }

    async function activateFile(name){
      const res = await fetch('/api/config/activate', {
        method:'POST',
        headers:{'Content-Type':'application/json'},
        body: JSON.stringify({name})
      });
      if(!res.ok){ setStatus('Aktivieren fehlgeschlagen', false); return; }
      setStatus('Aktiviert: ' + name);
      refreshList();
    }

    // Buttons
    document.getElementById('btnLoad').onclick = () => {
      const name = fileNameEl.value.trim();
      if(!name) return setStatus('Bitte Dateinamen eingeben oder aus der Liste wählen', false);
      loadFile(name);
    };
    document.getElementById('btnSave').onclick = () => {
      const name = fileNameEl.value.trim();
      if(!name.endsWith('.json')) return setStatus('Dateiname muss auf .json enden', false);
      saveFile(name);
    };
    document.getElementById('btnSaveAs').onclick = async () => {
      const name = prompt('Speichern unter (mit .json):', fileNameEl.value.trim() || 'config-neu.json');
      if(!name) return;
      if(!name.endsWith('.json')) return setStatus('Dateiname muss auf .json enden', false);
      fileNameEl.value = name;
      saveFile(name);
    };
    document.getElementById('btnActivate').onclick = () => {
      const name = fileNameEl.value.trim();
      if(!name) return setStatus('Bitte zuerst eine Datei laden/speichern', false);
      activateFile(name);
    };

    refreshList();
  </script>
</body>
</html>
