<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="utf-8" />
  <title>x-ski – Profil</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="stylesheet" href="/static/css/style.css" />
  <style>
    :root { --ink: #12324a; --muted: #5b7690; --accent: #ff7b00; --line: #dbe5ee; }
    html, body { margin: 0; min-height: 100%; }
    body { background: #f4f8fb; color: var(--ink);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
    .page { max-width: 880px; margin: 0 auto; padding: 24px 16px 40px; }
    h1 { font-size: 30px; margin: 4px 0 18px; }
    .card { background: #fff; border: 1px solid var(--line); border-radius: 16px; padding: 18px 20px; margin-bottom: 18px;
      box-shadow: 0 6px 24px rgba(18, 50, 74, 0.06); }
    .card h2 { font-size: 19px; margin: 0 0 12px; }
    .grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 14px 20px; }
    .field label { display: block; font-weight: 700; font-size: 15px; margin-bottom: 5px; }
    .field .row { display: flex; align-items: center; gap: 8px; }
    .field input { width: 100%; box-sizing: border-box; font: inherit; font-size: 17px; padding: 9px 11px;
      border: 1px solid #c9d6e2; border-radius: 9px; background: #fff; color: var(--ink); }
    .field input:focus { outline: 2px solid var(--accent); outline-offset: 1px; }
    .field .unit { color: var(--muted); white-space: nowrap; font-size: 14px; }
    .field .help { color: var(--muted); font-size: 13px; margin-top: 4px; line-height: 1.35; }
    .actions { display: flex; gap: 12px; align-items: center; flex-wrap: wrap; }
    .btn { font: inherit; font-size: 17px; padding: 11px 20px; border-radius: 10px; border: 1px solid var(--line);
      background: #fff; color: var(--ink); cursor: pointer; }
    .btn.primary { background: var(--accent); border-color: var(--accent); color: #fff; font-weight: 700; }
    .btn:disabled { opacity: .6; cursor: wait; }
    #msg { font-weight: 600; }
    #msg.ok { color: #15803d; } #msg.err { color: #b91c1c; }
    @media (max-width: 700px) { .grid { grid-template-columns: 1fr; } }
  </style>
</head>
<body>
  <div id="header-mount"></div>
  <div class="page">
    <h1>Profil</h1>
    <form id="form" novalidate></form>
    <div class="actions">
      <button class="btn primary" id="save" type="button">Speichern</button>
      <button class="btn" id="back" type="button">Zurück</button>
      <span id="msg" role="status"></span>
    </div>
  </div>

<script>
(() => {
  "use strict";
  const form = document.getElementById("form");
  let fields = [];

  async function loadHeader() {
    try {
      const res = await fetch("/header?active=profil", { cache: "no-store" });
      if (res.ok) document.getElementById("header-mount").innerHTML = await res.text();
    } catch (e) { /* optional */ }
  }

  function message(text, ok) {
    const el = document.getElementById("msg");
    el.textContent = text; el.className = ok ? "ok" : "err";
  }

  async function load() {
    let data;
    try {
      data = await (await fetch("/api/profile", { cache: "no-store" })).json();
    } catch (e) { message("Profil konnte nicht geladen werden.", false); return; }
    fields = data.fields;
    form.innerHTML = "";
    const groups = [...new Set(fields.map((f) => f.group))];
    for (const g of groups) {
      const card = document.createElement("section"); card.className = "card";
      const h = document.createElement("h2"); h.textContent = g; card.appendChild(h);
      const grid = document.createElement("div"); grid.className = "grid"; card.appendChild(grid);
      for (const f of fields.filter((x) => x.group === g)) {
        const id = `${f.section}.${f.key}`;
        const wrap = document.createElement("div"); wrap.className = "field";
        const label = document.createElement("label"); label.htmlFor = id; label.textContent = f.label;
        const row = document.createElement("div"); row.className = "row";
        const input = document.createElement("input");
        input.id = id; input.name = id; input.type = f.type;
        if (f.type === "checkbox") {
          input.style.width = "28px"; input.style.height = "28px";
          input.checked = data.values[id] === true;
        }
        if (f.type === "number") {
          input.inputMode = "decimal";
          if (f.min !== null) input.min = f.min;
          if (f.max !== null) input.max = f.max;
          if (f.step !== null) input.step = f.step;
        }
        const v = data.values[id];
        if (f.type !== "checkbox") input.value = v === null || v === undefined ? "" : v;
        row.appendChild(input);
        if (f.unit) { const u = document.createElement("span"); u.className = "unit"; u.textContent = f.unit; row.appendChild(u); }
        wrap.append(label, row);
        if (f.help) { const hp = document.createElement("div"); hp.className = "help"; hp.textContent = f.help; wrap.appendChild(hp); }
        grid.appendChild(wrap);
      }
      if (g === "Strava") card.appendChild(stravaBox());
      if (g === "Training") card.appendChild(calibBox());
      form.appendChild(card);
    }
    loadStrava();
  }

  function calibBox() {
    const box = document.createElement("div");
    box.style.cssText = "margin-top:14px;display:flex;align-items:center;gap:14px;flex-wrap:wrap";
    box.innerHTML = '<button class="btn primary" id="calib" type="button">Seilzug kalibrieren</button>' +
      '<span class="help" style="color:var(--muted);font-size:14px;max-width:520px">Geführter Test (ca. 10 min): ' +
      'misst Freilauf und Rückholbewegung und schlägt Grundzug, Rückzugskraft und Drehzahlgrenze vor ' +
      '(höchstens 20 % bzw. 3000 rpm).</span>';
    box.querySelector("#calib").addEventListener("click", startCalibration);
    return box;
  }

  async function startCalibration() {
    if (!confirm("Seilzug-Kalibrierung starten? Nicht gespeicherte Änderungen im Formular gehen verloren.")) return;
    let res;
    try {
      res = await fetch("/start", { method: "POST", headers: { "Content-Type": "application/json" },
                                   body: JSON.stringify({ mode: "calib" }) });
    } catch (e) { message("Keine Verbindung zum x-ski.", false); return; }
    if (res.status === 404 || res.status === 405) {
      message("Die Kalibrierung startet aus dem Startmenü – bitte das laufende Training zuerst beenden.", false);
      return;
    }
    const data = await res.json().catch(() => ({}));
    if (!res.ok || !data.ok) { message(data.message || "Start fehlgeschlagen.", false); return; }
    message("Kalibrierung wird gestartet …", true);
    for (let i = 0; i < 120; i++) {
      await new Promise((r) => setTimeout(r, 1000));
      try { const r = await fetch(data.next, { cache: "no-store" }); if (r.ok) { location.href = data.next; return; } }
      catch (e) { /* x-ski startet noch */ }
    }
    message("x-ski ist nicht gestartet – bitte die Konsole prüfen.", false);
  }

  function stravaBox() {
    const box = document.createElement("div");
    box.style.cssText = "margin-top:14px;display:flex;align-items:center;gap:14px;flex-wrap:wrap";
    box.innerHTML = '<span id="strava-status" style="font-size:17px">Status wird geprüft …</span>' +
      '<a class="btn" id="strava-connect" href="/strava/connect" style="text-decoration:none;background:#fc4c02;' +
      'border-color:#fc4c02;color:#fff;font-weight:700">Mit Strava verbinden</a>';
    return box;
  }

  async function loadStrava() {
    const el = document.getElementById("strava-status");
    if (!el) return;
    try {
      const st = await (await fetch("/api/strava", { cache: "no-store" })).json();
      if (!st.configured) el.textContent = "⚠️ " + (st.message || "Strava ist nicht eingerichtet.");
      else if (st.connected) {
        el.textContent = `✅ Verbunden${st.athlete ? " mit " + st.athlete : ""}`;
        document.getElementById("strava-connect").textContent = "Neu verbinden";
      } else el.textContent = "Nicht verbunden.";
    } catch (e) { el.textContent = "Status nicht abrufbar."; }
  }

  document.getElementById("save").addEventListener("click", async () => {
    const values = {};
    for (const f of fields) {
      const el = document.getElementById(`${f.section}.${f.key}`);
      values[`${f.section}.${f.key}`] = f.type === "checkbox" ? el.checked : el.value;
    }
    const btn = document.getElementById("save"); btn.disabled = true;
    try {
      const res = await fetch("/api/profile", { method: "POST", headers: { "Content-Type": "application/json" },
                                               body: JSON.stringify({ values }) });
      const data = await res.json();
      message(data.message || (res.ok ? "Gespeichert." : "Fehler beim Speichern."), res.ok && data.ok);
      if (res.ok && data.ok) loadHeader();
    } catch (e) {
      message("Keine Verbindung zum x-ski – läuft das Programm noch? Bitte x-ski neu starten und nochmals speichern.", false);
    } finally {
      btn.disabled = false;
    }
  });
  // Zur Startseite immer neu laden (nicht aus dem Browser-Zwischenspeicher), damit Profilnamen aktuell sind
  document.getElementById("back").addEventListener("click", () => { location.href = "/"; });

  loadHeader();
  load();
})();
</script>
</body>
</html>
