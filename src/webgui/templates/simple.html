<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Variable Control</title>
    <style>
        body, html {
            height: 100%;
            margin: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            font-family: Arial, sans-serif;
            font-size: 48px;
        }

        #display {
            height: 400px;
            width: 1200px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 96px;
            background-color: #f0f0f0;
            border-bottom: 2px solid #ddd;
        }

        #controls {
            height: 300px;
            width: 100%;
            display: flex;
            justify-content: space-around;
            align-items: center;
            background-color: #fff;
        }

        #stop-button-container {
            height: 300px;
            width: 1200px;
            display: flex;
            align-items: center;
            justify-content: center;
            background-color: #f9f9f9;
        }

        button {
            width: 400px;
            height: 200px;
            font-size: 48px;
            cursor: pointer;
            border: none;
            border-radius: 8px;
            transition: background-color 0.3s;
        }

        button#increment { background-color: #4CAF50; color: white; }
        button#decrement { background-color: #ff7b00; color: white; }
        button#set_to_20 { background-color: #2196F3; color: white; }
        button#stop { background-color: #e53935; color: white; }

        button:hover {
            filter: brightness(1.2);
        }

        .meta {
            margin-top: 20px;
            font-size: 28px;
            color: #666;
        }
    </style>
</head>
<body>

<div id="display">50</div>
<div class="meta">Bereich: 0–200</div>

<div id="controls">
    <button id="decrement">-</button>
    <button id="set_to_20">20%</button>
    <button id="increment">+</button>
</div>

<div id="stop-button-container">
    <button id="stop">Stop</button>
</div>

<script>
    const display = document.getElementById('display');
    const MAX_VALUE = 200;
    const MIN_VALUE = 0;

    function clampValue(value) {
        const num = Number(value);
        if (Number.isNaN(num)) return MIN_VALUE;
        return Math.max(MIN_VALUE, Math.min(num, MAX_VALUE));
    }

    function updateDisplay(value) {
        const clamped = clampValue(value);
        display.innerText = clamped;

        if (clamped >= MAX_VALUE) {
            display.style.color = "#e53935";
        } else if (clamped >= 150) {
            display.style.color = "#ff7b00";
        } else {
            display.style.color = "#000";
        }
    }

    function incrementValue() {
        fetch('/increment', { method: 'POST' })
            .then(response => response.json())
            .then(data => updateDisplay(data.value))
            .catch(error => console.error('Error:', error));
    }

    function decrementValue() {
        fetch('/decrement', { method: 'POST' })
            .then(response => response.json())
            .then(data => updateDisplay(data.value))
            .catch(error => console.error('Error:', error));
    }

    function setTo20() {
        fetch('/set_to_20', { method: 'POST' })
            .then(response => response.json())
            .then(data => updateDisplay(data.value))
            .catch(error => console.error('Error:', error));
    }

    function stopAction() {
        fetch('/stop', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ active: false })
        })
        .then(response => {
            if (response.ok) {
                console.log('Stop action sent successfully.');
            } else {
                console.error('Failed to send stop action.');
            }
        })
        .catch(error => console.error('Error:', error));
    }

    document.getElementById('increment').addEventListener('click', incrementValue);
    document.getElementById('decrement').addEventListener('click', decrementValue);
    document.getElementById('set_to_20').addEventListener('click', setTo20);
    document.getElementById('stop').addEventListener('click', stopAction);

    fetch('/get_value')
        .then(response => response.json())
        .then(data => updateDisplay(data.value))
        .catch(error => console.error('Error:', error));
</script>

</body>
</html>
