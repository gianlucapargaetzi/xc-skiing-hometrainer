<div class="header">
  <div class="header-left">
    <img src="/static/Logo-x-ski.ch.png" alt="x-ski Logo" class="logo" />
  </div>

  <div class="header-right">
    <div class="user-name">
      {{ (user.firstname or '') ~ ' ' ~ (user.lastname or '') }}
    </div>
    {% if user.birthdate %}
      <div class="user-meta">Geburtsdatum: {{ user.birthdate }}</div>
    {% endif %}
    {% if user.club %}
      <div class="user-meta">Verein: {{ user.club }}</div>
    {% endif %}
  </div>
</div>
