<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="utf-8" />
  <title>x-ski – Strava</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <style>
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #f4f8fb; color: #12324a;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
    .card { background: #fff; border: 1px solid #dbe5ee; border-radius: 18px; padding: 28px 32px; max-width: 560px;
      box-shadow: 0 6px 24px rgba(18, 50, 74, 0.08); text-align: center; }
    h1 { margin: 0 0 12px; font-size: 28px; }
    p { font-size: 19px; line-height: 1.4; }
    a { display: inline-block; margin-top: 10px; padding: 14px 26px; border-radius: 12px; background: #ff7b00; color: #fff;
      text-decoration: none; font-weight: 700; font-size: 20px; }
  </style>
</head>
<body>
  <div class="card">
    <h1>{{ "✅ Strava verbunden" if ok else "⚠️ Strava nicht verbunden" }}</h1>
    <p>{{ message }}</p>
    <a href="/profil">Zurück zum Profil</a>
  </div>
</body>
</html>
